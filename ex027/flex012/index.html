<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        div#caA{
            flex: 1 0 200px;
        }

        div#caB{
            flex: 1 1 150px;
        }

        div#caC{
            flex: 1 8 200px;
        }   

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="caA">A</div>
        <div class="item" id="caB">B</div>
        <div class="item" id="caC">C</div>
    </div>
</body>
</html>
