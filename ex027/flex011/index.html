<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
        }

        div#caA{
            flex-shrink: 1;
            flex-grow: 0;
        }

        div#caB{
            flex-shrink: 1;
            flex-grow: 2;
        }

        div#caC{
            flex-shrink: 0;
            flex-grow: 4;
        }   

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="caA">A</div>
        <div class="item" id="caB">B</div>
        <div class="item" id="caC">C</div>
    </div>
</body>
</html>
